name: Compile Godot vers Web
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
          cache: true
      - name: Import et vérification
        run: godot --headless --editor --path . --quit
      - name: Générer l'application Web
        run: |
          mkdir -p docs
          godot --headless --path . --export-release Web docs/index.html
          test -s docs/index.html
          test -n "$(find docs -maxdepth 1 -name '*.wasm' -print -quit)"
      - name: Publier les fichiers compilés dans docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/
          if ! git diff --cached --quiet; then
            git commit -m 'Exporter Godot Web [skip ci]'
            git push origin HEAD:main
          fi
